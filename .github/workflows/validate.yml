name: Local software validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run setup:pxt
      - run: npm test
      - run: npm run validate:pxt
      - run: npm run export:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pxt-validation
          path: built/validation/
